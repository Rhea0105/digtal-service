<!DOCTYPE html>
<!-- Declare the HTML5 document standard and set the page language to English -->
<html lang="en">
<head>
    <!-- Set the character encoding so text and special symbols display correctly -->
    <meta charset="UTF-8">
    <!-- Configure the viewport for responsive display on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Provide a page description for search engines and browser previews -->
    <meta name="description" content="Welcome to Chengdu, capital of Sichuan: history, spicy cuisine, giant pandas and famous sights in southwest China.">
    <!-- Set the title displayed in the browser tab -->
    <title>Home | Welcome to Chengdu</title>
    <!-- Link to the shared external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top navigation bar for links between the three pages -->
    <nav>
        <a href="index.html">Home</a>
        <a href="page2.html">Food</a>
        <a href="page3.html">Sights</a>
    </nav>

    <!-- Main content area of the page -->
    <main>
        <!-- Main page heading -->
        <h1>Welcome to Chengdu</h1>

        <!-- City street image; the hero class controls shared image presentation -->
        <img class="hero" src="street.jpg" alt="An old street in Chengdu with red lanterns" width="390" height="400">

        <!-- Brief introduction to Chengdu and its notable features -->
        <p>
            Chengdu is the capital of Sichuan Province in southwest China.
            It is known for its rich history, spicy cuisine, and as the home of the giant panda.
        </p>

        <!-- Table showing quick facts about Chengdu -->
        <table>
            <!-- Table header describing each column -->
            <tr>
                <th>Item</th>
                <th>Detail</th>
            </tr>
            <!-- Chengdu location information -->
            <tr>
                <td>Location</td>
                <td>Southwest China</td>
            </tr>
            <!-- Chengdu's notable attractions and specialties -->
            <tr>
                <td>Known for</td>
                <td>Pandas and hot pot</td>
            </tr>
        </table>

        <!-- Button-style link to the local food page -->
        <a class="btn" href="page2.html">See Local Food</a>
    </main>
</body>
</html>
